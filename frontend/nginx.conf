map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    # 用 $http_host 保留浏览器端口，否则 OpenIddict 发现文档里的端点会丢端口
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 业务接口：上传 50MB、问答最长 5 分钟
    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # OpenIddict 令牌端点与发现文档
    location /connect/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 60s;
    }

    location /.well-known/ {
        proxy_pass http://api:8080;
    }

    # SignalR：WebSocket 必须显式升级，且关闭缓冲避免流式消息被攒住
    location /signalr/ {
        proxy_pass http://api:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查与 Swagger（Swagger 只作为 API 文档/curl 调试入口）
    location /health {
        proxy_pass http://api:8080;
    }

    location /swagger {
        proxy_pass http://api:8080;
    }

    # Vite 产物：带 hash 的资源长缓存，index.html 不缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 刷新回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
