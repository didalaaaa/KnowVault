name: CI

# push / PR 到 main 触发：后端构建 + 单测 + 格式检查、集成测试（Testcontainers）、前端构建
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧运行在新提交到来后取消，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与单测
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore KnowVault.slnx

      - name: Release 构建
        run: dotnet build KnowVault.slnx -c Release --no-restore

      - name: 单元测试
        run: dotnet test tests/KnowVault.Tests/KnowVault.Tests.csproj -c Release --no-build

      - name: 枚举命名检查（IDE1006）
        run: dotnet format style KnowVault.slnx --no-restore --verify-no-changes --diagnostics IDE1006

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore KnowVault.slnx

      - name: Release 构建
        run: dotnet build KnowVault.slnx -c Release --no-restore

      # 详细日志同时写文件，失败时由下一步导出到 Run 页面（Actions 日志需要登录才能看，Run 页面公开可读）
      - name: 集成测试（PostgreSQL / RabbitMQ / MinIO / Qdrant）
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/KnowVault.IntegrationTests/KnowVault.IntegrationTests.csproj -c Release --no-build --logger "console;verbosity=detailed" 2>&1 | tee integration-test.log

      - name: 失败时导出诊断摘要
        if: failure()
        shell: bash
        run: |
          {
            echo '### 集成测试失败诊断'
            echo '#### dotnet test 日志（末尾 150 行）'
            echo '```text'
            tail -n 150 integration-test.log 2>/dev/null || echo '（没有日志文件）'
            echo '```'
            echo '#### Docker 环境'
            echo '```text'
            docker version --format '{{.Server.Version}}' 2>&1
            docker ps -a --format '{{.Image}} | {{.Status}}' 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 与 docker-compose 里的前端镜像基线（node:24-alpine）保持一致
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产构建
        working-directory: frontend
        run: npm run build
