name: CI

# push / PR 到 main 触发：后端构建 + 单测 + 格式检查、集成测试（Testcontainers）、前端构建
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧运行在新提交到来后取消，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与单测
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore KnowVault.slnx

      - name: Release 构建
        run: dotnet build KnowVault.slnx -c Release --no-restore

      - name: 单元测试
        run: dotnet test tests/KnowVault.Tests/KnowVault.Tests.csproj -c Release --no-build

      - name: 枚举命名检查（IDE1006）
        run: dotnet format style KnowVault.slnx --no-restore --verify-no-changes --diagnostics IDE1006

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore KnowVault.slnx

      - name: Release 构建
        run: dotnet build KnowVault.slnx -c Release --no-restore

      # GitHub Runner 匿名拉取 Docker Hub 会拒绝 minio/minio（pull access denied），
      # 这里用 KNOWVAULT_SKIP_MINIO=1 让文档存储走内存假实现；本机跑集成测试仍是真 MinIO 容器
      - name: 集成测试（PostgreSQL / RabbitMQ / Qdrant + MinIO 兜底）
        env:
          KNOWVAULT_SKIP_MINIO: '1'
        run: dotnet test tests/KnowVault.IntegrationTests/KnowVault.IntegrationTests.csproj -c Release --no-build

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 与 docker-compose 里的前端镜像基线（node:24-alpine）保持一致
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产构建
        working-directory: frontend
        run: npm run build
